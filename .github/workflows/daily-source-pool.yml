name: Daily IPTV Source Pool

on:
  workflow_dispatch:

  schedule:
    # UTC 18:30 = 北京时间次日 02:30
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-source-pool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build IPTV source pool
        run: |
          python scripts/build_pool.py

      - name: Validate generated files
        run: |
          test -s output/global-merged.m3u
          test -f output/openwrt-sources.txt
          test -s output/source-status.json
          test -s output/provenance.json

          echo "Generated files:"
          ls -lh output/

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi

          git commit -m "chore: update IPTV source pool"
          git push
